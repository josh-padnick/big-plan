<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <style>
    .dark { display: none; }
    .frame { stroke: #171923; }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: inline; }
      .frame { stroke: #FFFFFF; }
    }
  </style>
  <rect class="frame" x="7" y="7" width="242" height="242" rx="44" fill="none" stroke-width="10" opacity="0.85"/>
  <image class="light" href="data:image/png;base64," x="52" y="52" width="152" height="152"/>
  <image class="dark" href="data:image/png;base64," x="52" y="52" width="152" height="152"/>
</svg>
