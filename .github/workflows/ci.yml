# CI: lint on every PR and on main. Build/test jobs join this workflow as the
# suite grows; lint is the first enforced gate.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Reads the packageManager field so CI and local bun stay in lockstep.
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
