# CI: lint on every PR and on main. Build/test jobs join this workflow as the
# suite grows; lint is the first enforced gate.
name: CI

# Runs on every push to every branch; the run on a PR's head commit shows up
# in the PR's checks. (PRs from forks would need a pull_request trigger; add
# one when outside contributions start.)
on:
  push:

jobs:
  lint:
    # Matches fabricahq/app: CI runs on the local self-hosted runner.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Reads the packageManager field so CI and local bun stay in lockstep.
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
