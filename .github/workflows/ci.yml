# CI: lint, build, unit-test, and browser-test every pushed branch, including
# main and same-repository PR heads.
name: CI

# Runs on every push to every branch; the run on a PR's head commit shows up
# in the PR's checks. Policy: trusted contributors only on the self-hosted
# runner. Fork PRs deliberately get no pull_request trigger here - external
# contributions must never execute workflows on the local machine. If outside
# contributions arrive, add a separate GitHub-hosted workflow for them.
on:
  push:

jobs:
  lint:
    # Runs on the local self-hosted runner.
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge guard compares this branch against main, so it needs the
          # full history and the origin/main remote-tracking ref.
          fetch-depth: 0
      # Runs before the toolchain because it is pure git and takes under a
      # second. A branch that would delete merged main work should fail fast.
      - name: Merged main work must not disappear
        run: node scripts/merge-guard/check.mjs
      # The companion warner. It sees the one loss shape the blocking guard
      # cannot: stale file bytes that arrive as ordinary fresh commits. It
      # cannot tell that apart from an honest large refactor, so it never
      # gates. The script exits 0 on every outcome, including its own failure;
      # continue-on-error is the second belt, so even a crash in node itself
      # cannot turn this job red. A human adjudicates each warning.
      - name: Stale-copy warning (never fails the build)
        continue-on-error: true
        run: node scripts/merge-guard/warn-stale-copy.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          # Reads the packageManager field so CI and local bun stay in lockstep.
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Runtime dependencies must have no high or critical vulnerabilities
        run: npm audit --no-package-lock --omit=dev --audit-level=high
      - run: bun run lint
      - run: bun run build
      # Generated modules are committed; build just regenerated them, so any
      # difference means a source changed without its generated output.
      - name: Generated files must not drift from their sources
        run: |
          if [ -n "$(git status --porcelain -- '*.generated.ts' '*.generated.css')" ]; then
            git status --porcelain -- '*.generated.ts' '*.generated.css'
            echo "::error::Generated files drifted from their sources. Run 'bun run gen' and commit the result."
            exit 1
          fi
      - run: bun run test
      - run: bunx playwright install chromium
      - name: Run browser tests through the stable plan proxy
        run: bun run test:e2e
      - name: Run browser tests through the redirect escape hatch
        run: bun run test:e2e
        env:
          BIG_PLAN_PROXY: "0"
