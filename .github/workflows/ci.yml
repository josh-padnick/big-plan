# CI: lint, build, unit-test, and browser-test every pushed branch, including
# main and same-repository PR heads.
name: CI

# Runs on every push to every branch; the run on a PR's head commit shows up
# in the PR's checks. Policy: trusted contributors only on the self-hosted
# runner. Fork PRs deliberately get no pull_request trigger here - external
# contributions must never execute workflows on the local machine. If outside
# contributions arrive, add a separate GitHub-hosted workflow for them.
on:
  push:

# One lane per branch. The self-hosted runner is a single machine, so several
# branch builds racing on it is what starves the browser suite into timing
# failures a good tree does not deserve; a branch stacking its own superseded
# pushes on top of that is the share this repository controls. Only the newest
# push on a branch is worth a runner, and a run this cancels is a run whose
# commit is no longer the branch tip. `main` is exempt: every commit that lands
# there is verified on its own, and no later push may cancel that proof.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    # Runs on the local self-hosted runner.
    runs-on: self-hosted
    # Serialize every self-hosted job that runs the verify suite - this lint
    # job, the release Verify job, and its dry-run - into one machine-wide lane.
    # The two runner instances live on a single Mac Mini, so two full e2e suites
    # at once oversubscribe its CPU and starve the local review server into 500s
    # and draft 409s. One shared group with cancel-in-progress false makes them
    # queue instead of collide; the group is deliberately not ref-scoped because
    # the contention is per-machine, not per-branch. Keep this group string in
    # exact sync with the Verify and dry-run jobs in publish.yml.
    concurrency:
      group: bigplan-verify-suite-self-hosted
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge guard compares this branch against main, so it needs the
          # full history and the origin/main remote-tracking ref.
          fetch-depth: 0
      # Runs before the toolchain because it is pure git and takes under a
      # second. A branch that would delete merged main work should fail fast.
      - name: Merged main work must not disappear
        run: node scripts/merge-guard/check.mjs
      # The companion warner. It sees the one loss shape the blocking guard
      # cannot: stale file bytes that arrive as ordinary fresh commits. It
      # cannot tell that apart from an honest large refactor, so it never
      # gates. The script exits 0 on every outcome, including its own failure;
      # continue-on-error is the second belt, so even a crash in node itself
      # cannot turn this job red. A human adjudicates each warning.
      - name: Stale-copy warning (never fails the build)
        continue-on-error: true
        run: node scripts/merge-guard/warn-stale-copy.mjs
      # Setup, audit, lint, build, drift check, and the full unit + browser test
      # sequence live in one composite action that the release Verify job runs
      # too, on this same self-hosted runner, so the two environments cannot
      # drift apart. See .github/actions/verify-suite/action.yml.
      - name: Build and run the full test suite
        uses: ./.github/actions/verify-suite

  # Proves the runtime-dependency audit gate fails closed, in this PR's own CI,
  # rather than only in a local run. It drives the real audit-gate entrypoint
  # end to end against recorded npm-audit output (the --fixture seam), and this
  # job goes RED if the gate ever retries a high/critical policy finding into a
  # pass, or refuses to retry a genuine transport error. See
  # scripts/npm-audit-gate/README.md. Node-only, so it needs no toolchain setup.
  audit-gate-selftest:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Audit gate must fail closed on a policy finding and retry only transport errors
        run: node scripts/npm-audit-gate/selftest.mjs
