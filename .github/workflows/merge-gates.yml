# Merge gates: the two required checks from BIG-164. One says a third-party
# review was triaged to completion on this exact head; the other says the
# no-mistakes pipeline passed on it, or that skipping it was a deliberate,
# attributable decision. CONTRIBUTING.md owns the protocol and the comment
# formats; scripts/merge-gates/gates.mjs owns the rules.
#
# Branch protection must require these two check names, which the workflow
# publishes through the Checks API rather than as job conclusions:
#
#     review-triage
#     validation-attestation
#
# The gate updates only check runs its own app created; a run of the same name
# from another installed app belongs to that app, and patching it is refused.
#
# The comment triggers are the point of this design. Triage completes by
# writing, not by pushing, so a gate has to be able to go green on a comment
# alone. A workflow started by issue_comment runs against the default branch, so
# its own job conclusion never lands on the pull request's checks - but a check
# run it creates against the pull request's head sha does. Every trigger below
# therefore runs the same evaluation and republishes the same two named checks.
#
# Measured on 2026-08-18 while building this: pull_request and
# pull_request_review_comment run the branch's copy of this file, and
# issue_comment runs main's copy and nothing else. So a change to the gate
# governs conversation comments only once it merges, which is why
# workflow_dispatch exists.
#
# What enforces that property is a repository setting, not this file. "Fork
# pull request workflows from outside collaborators" is off, so a fork pull
# request cannot run any workflow in this private repository. Re-verify it with
#
#     gh api repos/josh-padnick/big-plan/actions/permissions/fork-pr-workflows-private-repos
#
# which read run_workflows_from_fork_pull_requests: false on 2026-08-18.
#
# The same-repository condition on the job below is a second belt, not the
# boundary. pull_request, pull_request_review, and pull_request_review_comment
# all run the workflow definition from the pull request's own ref, so a fork
# supplies this very file and could delete that condition; nothing written here
# can stop it. The condition is worth keeping - it costs nothing and it states
# the intent - but it must not be read as the thing that holds the property.
# issue_comment and workflow_dispatch run the default branch's copy and read
# the pull request over the API, so they execute nothing a fork wrote.
#
# Standing condition: if that repository setting is ever enabled, this gate
# must move to pull_request_target or lose its pull_request,
# pull_request_review, and pull_request_review_comment triggers, because the
# job condition alone will not hold.
#
# The consequence, deliberately in the safe direction: a fork pull request gets
# no gate report from its own pushes, so its two required checks never report
# and the merge stays blocked. A maintainer who wants to judge one runs this
# workflow from the Actions tab with the pull request number.
name: Merge gates

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  # The manual re-check. Also the way to evaluate a pull request whose branch
  # predates this workflow, since comment events always run the default
  # branch's copy of it.
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request number to judge
        required: true

# One judgment per pull request at a time, but only among the runs that can
# afford to be cancelled. The two trigger classes are not symmetric, and that
# asymmetry is what this group has to respect.
#
# issue_comment and workflow_dispatch run against the default branch, so their
# head sha is main's and this job's own conclusion never lands on the pull
# request. Everything they say, they say through the two check runs the script
# publishes. Cancelling one costs nothing a reader can see, which is exactly
# what "settle on the newest state" wants.
#
# pull_request and the two review events run against the pull request's own
# ref, so their head sha is the pull request's head, and GitHub publishes this
# job's conclusion as a check run named `judge` on it. Cancelling one of those
# turns it red, and no later run repairs it: the conversation triggers publish
# review-triage and validation-attestation, never `judge`. So the pull request
# is left carrying a permanent red check the gate never meant to publish, from
# a cancellation whose only explanation is a concurrency annotation.
#
# That is not hypothetical. Measured on 2026-08-18: a comment on pull request
# #131 cancelled that pull request's own pull_request run one second after it
# started, and on #169 five head-ref runs landed on one head sha and four were
# cancelled. Note what the second case rules out - keying the group by head sha
# would not have saved them, because they shared a sha. Only a group they
# cannot share does.
#
# So head-ref runs get a group of their own, per run, and are never cancelled.
# Two of them can now publish out of order. That race is real and it is the
# lesser harm: both runs read live pull request state seconds apart and publish
# the same two idempotent checks, and the next event corrects any disagreement,
# whereas a cancelled `judge` is a red check nothing ever corrects.
concurrency:
  group: >-
    merge-gates-${{ github.event.pull_request
    && format('head-{0}', github.run_id)
    || format('conversation-{0}', github.event.issue.number || inputs.pull-request) }}
  cancel-in-progress: ${{ !github.event.pull_request }}

jobs:
  judge:
    # Second belt against running fork-authored code:
    # the events that run the pull request's own ref are allowed only for a
    # pull request whose head lives in this repository. The header explains why
    # this cannot be the boundary and names the repository setting that is.
    # issue_comment is allowed because it runs the default branch, and only for
    # a comment on a pull request - plain issues fire it too, and they have no
    # head to gate. workflow_dispatch is the maintainer path, including for a
    # fork pull request.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # The gate is one API-reading script. Anything longer than this is wedged.
    timeout-minutes: 10
    permissions:
      # An explicit block sets every scope it omits to none, so the checkout of
      # this private repository needs its read stated here.
      contents: read
      # Publishing the two named check runs.
      checks: write
      # Reading the pull request, its reviews, and its inline threads.
      pull-requests: read
      # Reading the pull request conversation, where every marker comment lives.
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate runs no git command after this, so the token must not stay
          # behind in .git/config.
          persist-credentials: false
      # No toolchain step: the gate is one Node script with no dependencies.
      - name: Judge the merge gates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_GATES_PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pull-request }}
        run: node scripts/merge-gates/check.mjs
