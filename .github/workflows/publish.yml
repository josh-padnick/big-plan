# Publishes an immutable npm release from a version tag on main, proves the
# package came from this workflow, and exercises the canary before promotion.
# Pull requests that touch this workflow run the verify dry-run only, so a
# change to the release verification proves the full unit + browser test
# sequence still passes - on the same self-hosted runner and through the same
# composite action the release Verify job uses - before it can turn a release
# red.
name: Publish npm canary

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - .github/workflows/publish.yml

permissions:
  contents: read

concurrency:
  # Every real release (a tag push) shares one fixed lane, because they all
  # publish the shared `next` dist-tag and must never run at once. Pull-request
  # dry-runs get their own per-ref lane so one never queues behind a release or
  # another PR.
  group: npm-release-${{ github.event_name == 'push' && 'publish-next' || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    # Only a tag push verifies-and-releases; pull requests run the dry-run job
    # below, never this publish chain.
    if: github.event_name == 'push'
    # The same self-hosted runner CI's lint job uses, through the same composite
    # action, so a release is gated by the exact environment that passed on the
    # branch. The visual e2e specs assert font-metric ratios and a pixel
    # snapshot captured on this runner; verifying on any other runner image
    # fails tests that lint passed on the identical commit. That drift is what
    # this job used to reintroduce by hand-copying lint's steps onto ubuntu.
    runs-on: self-hosted
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a package-version tag from main
        id: release
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must equal package version v${package_version}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Release tag ${GITHUB_REF_NAME} must point to a commit on main."
            exit 1
          fi
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
      # The identical setup + full unit and browser test sequence CI's lint job
      # runs. Sharing one composite action on one runner is what keeps this
      # release gate from drifting away from the CI that already passed. See
      # .github/actions/verify-suite/action.yml.
      - name: Build and run the full test suite
        uses: ./.github/actions/verify-suite

  # Proves the whole shared sequence still passes, in this PR's own checks,
  # before a release ever relies on it. The push-tags trigger cannot run on a
  # PR, so this is the only place a change to publish.yml can prove the Verify
  # job it feeds still runs green end to end. It runs the identical composite
  # action on the identical self-hosted runner Verify uses, so it exercises the
  # full unit + browser (e2e) sequence, not a unit-only subset - the earlier
  # unit-only dry-run is exactly what let visual e2e drift reach a release.
  #
  # Same-repository pull requests only. This job runs on the self-hosted runner,
  # and this repository's policy (see ci.yml) is that external contributions
  # must never execute a workflow on the local machine. A fork PR's head repo is
  # not this repository, so the guard keeps a fork's code - including any edit to
  # this very workflow or to the composite action it calls - off the runner,
  # while every trusted in-repo branch (the only kind that reaches a release)
  # still gets the full dry-run.
  verify-dry-run:
    name: Verify dry-run
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # Match the Verify job: the contract/probe tests in `bun run test`
          # walk git history (git show <old rev>, merge-base to main), so a
          # shallow clone fails them. Fetch the full history like Verify does.
          fetch-depth: 0
          persist-credentials: false
      - name: Build and run the full test suite
        uses: ./.github/actions/verify-suite

  publish-next:
    name: Publish to next
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/big-plan/v/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require an OIDC-capable npm CLI
        shell: bash
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [major = 0, minor = 0, patch = 0] = process.argv[1]
              .split(".")
              .map(Number);
            const isSupported =
              major > 11 ||
              (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!isSupported) process.exit(1);
          ' "$npm_version" || {
            echo "::error::npm ${npm_version} is too old for Trusted Publishing; npm 11.5.1 or newer is required."
            exit 1
          }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish immutable canary with provenance
        run: npm publish --access public --tag next --provenance

  smoke-next:
    name: Smoke-test next
    needs: [verify, publish-next]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Exercise the published CLI in a clean environment
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            next_version="$(npm view big-plan@next version 2>/dev/null || true)"
            [[ "$next_version" == "$RELEASE_VERSION" ]] && break
            if [[ "$attempt" == 6 ]]; then
              echo "::error::big-plan@next is ${next_version:-unavailable}; expected ${RELEASE_VERSION}."
              exit 1
            fi
            sleep 10
          done

          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          export HOME="$smoke_root/home"
          export BIG_PLAN_STATE_DIR="$smoke_root/state"
          export NPM_CONFIG_CACHE="$smoke_root/npm-cache"
          mkdir -p "$HOME" "$BIG_PLAN_STATE_DIR" "$smoke_root/work" "$smoke_root/package"

          archive="$(npm pack "big-plan@${RELEASE_VERSION}" --pack-destination "$smoke_root" --silent)"
          tar -xzf "$smoke_root/$archive" -C "$smoke_root/package"
          plan="$smoke_root/package/package/examples/diff-gallery-before.mdx"
          cd "$smoke_root/work"
          npx -y big-plan@next guidance > guidance-next.md
          npx -y big-plan@next validate "$plan"
          npx -y big-plan@next render "$plan" next-smoke.html
          test -s next-smoke.html

          npx -y "big-plan@${RELEASE_VERSION}" guidance > guidance-release.md
          npx -y "big-plan@${RELEASE_VERSION}" validate "$plan"
          npx -y "big-plan@${RELEASE_VERSION}" render "$plan" release-smoke.html
          test -s release-smoke.html

          final_next_version="$(npm view big-plan@next version)"
          if [[ "$final_next_version" != "$RELEASE_VERSION" ]]; then
            echo "::error::big-plan@next moved to ${final_next_version} during the smoke test."
            exit 1
          fi
