# Builds the public documentation from its authoritative sources and deploys
# the resulting static site to GitHub Pages after each push to main, including merges.
# Pull requests that touch the docs or this workflow run the build job only, so a
# docs change proves it builds on the runner before it can turn the main deploy red.
name: Deploy docs

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - docs/**
      - .github/workflows/docs.yml

permissions:
  contents: read

concurrency:
  # Serialize the Pages deploy on main under one group; give each PR its own
  # group so build-only PR runs never queue behind the main deploy or each other.
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pin third-party workflow code because the deploy job receives Pages
      # write credentials; the release comments keep upgrades discoverable.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Build the CLI used by the docs demo generator
        run: bun run build
      # The docs demo generator runs `big-plan render`, which renders Mermaid
      # diagrams in the pinned Playwright Chromium. The runner has no browser
      # cache, so install it here or the docs build aborts.
      - name: Install the pinned Playwright Chromium for compile-time Mermaid
        run: bunx playwright install chromium
      - name: Acknowledge current plan-writing guidance
        working-directory: docs
        run: node ../bin/big-plan.mjs guidance >/dev/null
      - name: Install docs dependencies
        run: bun install --cwd docs --frozen-lockfile
      - name: Build docs
        working-directory: docs
        run: bun run build
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/dist

  deploy:
    name: Deploy docs
    needs: build
    # Publish only from a push to main; pull-request runs stop after the build
    # job so a PR can never deploy the site.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
