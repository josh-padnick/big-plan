# Builds the public documentation from its authoritative sources and deploys
# the resulting static site to GitHub Pages after each merge to main.
name: Deploy docs

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Build the CLI used by the docs demo generator
        run: bun run build
      - name: Acknowledge current plan-writing guidance
        working-directory: docs
        run: node ../bin/big-plan.mjs guidance >/dev/null
      - name: Install docs dependencies
        run: bun install --cwd docs --frozen-lockfile
      - name: Build docs
        working-directory: docs
        run: bun run build
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

  deploy:
    name: Deploy docs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
