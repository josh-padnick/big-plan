# Builds the public documentation from its authoritative sources and deploys
# the resulting static site to GitHub Pages after each merge to main.
name: Deploy docs

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Build the CLI used by the docs demo generator
        run: bun run build
      - name: Acknowledge current plan-writing guidance
        working-directory: docs
        run: node ../bin/big-plan.mjs guidance >/dev/null
      - name: Install docs dependencies
        run: bun install --cwd docs --frozen-lockfile
      - name: Build docs
        working-directory: docs
        run: bun run build
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/dist

  deploy:
    name: Deploy docs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
