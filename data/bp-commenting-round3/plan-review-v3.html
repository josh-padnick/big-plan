<style>/*
The harness's own chrome. It inherits Big Plan's palette variables from the
rendered document's embedded stylesheet, so light and dark follow the same
tokens the real product uses.

Two of the captain's recorded rules shape everything here:
  - Hover and highlight stay calm: no flood of colour, no layout shift, no
    jumpiness. State changes are a border, a tint, or a lift.
  - Information hierarchy: titles louder than body, asides quieter than both.
    The honesty band is an aside, not a warning.
*/

/* One neutral wash for every hover state, so nothing hover-related borrows
   the accent colour that means "selected". */
:root {
  /* Faint enough to read as "this block is the target" rather than as a
     highlight competing with the text it sits behind. */
  --sim-neutral: color-mix(in srgb, var(--ink-c) 3.5%, transparent);
  --sim-neutral-line: color-mix(in srgb, var(--ink-c) 26%, transparent);
  /* Controls need an opaque hover fill. A transparent wash lets selected
     text and content show through the button itself, which caused the
     selection pill's washed-out bar regression. */
  --sim-control-hover: color-mix(in srgb, var(--ink-c) 4%, var(--bg));
  --sim-control-active: color-mix(in srgb, var(--ink-c) 8%, var(--bg));
}

/* The document's own header, with the review controls on its right. */
.sim-toolbar {
  position: sticky;
  top: 0;
  z-index: 30;
}
.sim-toolbar-brand header {
  position: static !important;
}
.sim-toolbar-controls {
  position: absolute;
  top: 0;
  right: 1.25rem;
  display: flex;
  height: 2.75rem;
  align-items: center;
  gap: 0.6rem;
}
.sim-simulated {
  color: var(--muted-c);
  font-size: 0.6875rem;
  letter-spacing: 0.02em;
}
.sim-tray-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.25rem 0.6rem;
  border: none;
  border-radius: 0.35rem;
  background: transparent;
  color: var(--muted-c);
  font: inherit;
  font-size: 0.8125rem;
  cursor: pointer;
}
.sim-tray-toggle:hover {
  background: var(--sim-control-hover);
  color: var(--ink-c);
}
.sim-tray-toggle[aria-pressed="true"] {
  background: var(--sim-control-hover);
  color: var(--ink-c);
}
.sim-tray-toggle:active {
  background: var(--sim-control-active);
}
.sim-toggle-count {
  min-width: 1.15rem;
  padding: 0 0.3rem;
  border-radius: 999px;
  background: var(--accent-c);
  color: var(--bg);
  font-size: 0.6875rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-align: center;
}

.sim-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  justify-content: center;
  gap: 2rem;
  padding: 1.75rem 1.25rem 4rem;
}
@media (width >= 80rem) {
  .sim-layout {
    grid-template-columns: 13rem minmax(0, 74ch);
    column-gap: 2.25rem;
  }
  /* Docked flush to the page's right edge, with the page reserving its width
     so nothing is ever underneath it. Embedded rather than overlaid: the
     reading column reflows into the space that is left. */
  .sim-layout[data-tray="open"] {
    padding-right: 23.25rem;
  }
}

.sim-column {
  min-width: 0;
}

/* The shell's own nav, kept sticky under this harness's taller bar. */
.sim-contents {
  display: none;
}
@media (width >= 80rem) {
  .sim-contents {
    display: block;
    position: sticky;
    top: 4.25rem;
    align-self: start;
    max-height: calc(100vh - 5.75rem);
    overflow-y: auto;
  }
}
.sim-contents nav {
  display: block !important;
  position: static !important;
}

/* ------------------------------------------------------------- the plan */

/* The reading column and its left gutter. The gutter is where the eye already
   is when a block ends, so the way in and the sign that something is there
   both live here - and they are the same object, never two competing ones. */
.sim-plan-wrap {
  position: relative;
}

/* The gutter lives INSIDE the reading column, in the slide card's own left
   inset - the 2.1rem band between a card's border and its text. Measured:
   the card's padding-left is 33.6px at every width, while the space between
   the contents sidebar and the column is only 36-48px. Marks placed in that
   page margin were one narrow window away from landing on the sidebar, and
   with the sidebar restored they did. Inside the column they cannot reach it
   at any width, because the column's own left edge is the boundary. */
.sim-gutter {
  position: absolute;
  top: 0;
  bottom: 0;
  /* The mark straddles the slide border rather than sitting inside the card's
     padding: further left keeps it clear of the text, and the border is the
     one thing it is allowed to cross. z-index lifts it over the card so it
     paints on top of that border instead of being covered by it. */
  left: -1.5rem;
  width: 3rem;
  z-index: 3;
  pointer-events: auto;
}

/* The product shell already establishes the top-level left edge. The harness
   must not add a blanket text inset: doing so shifted the title and subtitle
   while cards and components stayed on the native outer edge. */
.sim-plan > [data-subpart] {
  padding-left: 2.1rem;
}

/* The mark. One object per block, in one slot: a quiet outline when the block
   carries nothing and is hovered, a filled mark when it carries comments. Its
   look is unchanged from the version the captain approved - only where it
   sits has moved. */
/* Centred on the slide border line: the border runs through the middle of the
   mark. No outline box - hover is a background shift only, and the glyph never
   changes strength, so the icon reads as an available control at rest rather
   than as a faded or disabled one. Opacity is deliberately not used for the
   state change for exactly that reason. */
.sim-gutter-add,
.sim-gutter-note {
  position: absolute;
  left: 0.75rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.5rem;
  height: 1.5rem;
  border: none;
  border-radius: 0.35rem;
  background: transparent;
  color: var(--muted-c);
  cursor: pointer;
}
.sim-gutter-add:hover,
.sim-gutter-add:focus-visible,
.sim-gutter-note:hover,
.sim-gutter-note:focus-visible {
  background: var(--sim-neutral);
}
.sim-gutter-add:active,
.sim-gutter-note:active {
  background: var(--sim-control-active);
}
/* A block that already carries comments keeps its glyph in the accent, so
   "something is here" is legible before any hover - a colour difference, not
   a strength difference. */
.sim-gutter-note {
  color: var(--accent-c);
}
.sim-gutter-note[data-outcome="changed"] {
  color: var(--diff-add-c);
}
.sim-gutter-note[data-outcome="question"] {
  color: var(--callout-warning-c);
}
.sim-gutter-note-head {
  display: inline-flex;
  align-items: center;
  gap: 0.1rem;
}
.sim-gutter-count {
  font-size: 0.5625rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* Truncated, the way Google Docs and Notion show one: enough to recognise
   what you said without opening anything. It opens on hover or focus and
   always to the RIGHT, into the column, so it has no way to travel left
   toward the sidebar however narrow the window gets. */
.sim-gutter-preview {
  position: absolute;
  top: -0.3rem;
  left: 2.6rem;
  z-index: 5;
  display: none;
  width: 15rem;
  padding: 0.4rem 0.55rem;
  border: 1px solid var(--edge-c);
  border-left: 2px solid var(--muted-c);
  border-radius: 0.4rem;
  background: var(--bg);
  color: var(--ink-c);
  font-size: 0.6875rem;
  line-height: 1.45;
  text-align: left;
  box-shadow: 0 4px 14px rgb(0 0 0 / 0.12);
  overflow: hidden;
  -webkit-line-clamp: 4;
  line-clamp: 4;
}
.sim-gutter-note:hover .sim-gutter-preview,
.sim-gutter-note:focus-visible .sim-gutter-preview {
  display: -webkit-box;
  -webkit-box-orient: vertical;
}

.sim-plan [data-block-id] {
  position: relative;
  /* Only opacity animates. Hover background is deliberately untransitioned:
     a fade means the wash lags the pointer on the way in and lingers on the
     way out, which is what made the gutter icon feel like it was escaping. */
  transition: opacity 320ms ease;
}

/* Hover is neutral, not accent: a hover is neither selected nor active, so
   it reads as a faint gray wash rather than the green that means "chosen". */
.sim-plan [data-sim-hover] {
  background: var(--sim-neutral);
}

/* The block the agent is working on right now. */
.sim-plan [data-sim-focus] {
  background: color-mix(in srgb, var(--annotation-bg) 55%, transparent);
}

/* A block the revision marked. */
.sim-plan [data-sim-changed] {

.sim-plan [data-sim-quiet] {

/* The other way in. Same glyph, same no-border, same background-only hover as

.sim-affordance {

  z-index: 40;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.25rem 0.55rem;
  border: none;
  border-radius: 0.35rem;
  background: var(--bg);

  font: inherit;
  font-size: 0.75rem;
  cursor: pointer;
  box-shadow: 0 2px 10px rgb(0 0 0 / 0.14);
}
.sim-affordance:hover,
.sim-affordance:focus-visible {

}
.sim-affordance:active {

}

/* ------------------------------------------------------------ the revision */

.sim-revision {
  margin-bottom: 1.75rem;
  padding: 1rem 1.15rem 1.1rem;
  border: 1px solid var(--diff-add-c);
  border-radius: 0.75rem;

  animation: sim-arrive 520ms ease-out;
}
.sim-revision-head {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
}
.sim-revision-version {
  padding: 0.1rem 0.45rem;
  border-radius: 0.25rem;
  background: var(--diff-add-c);
  color: var(--bg);
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.sim-revision-head h2 {
  margin: 0;
  font-size: 1.0625rem;
  font-weight: 600;
  color: var(--ink-c);
}
.sim-revision-note {
  margin: 0.5rem 0 0.7rem;

  font-size: 0.8125rem;
  line-height: 1.55;
}
.sim-toggle {
  display: inline-flex;
  align-items: center;

  color: var(--muted-c);
  font-size: 0.75rem;
}

@keyframes sim-arrive {
  from {
    opacity: 0;
    transform: translateY(-6px);

}
@media (prefers-reduced-motion: reduce) {
  .sim-revision {
    animation: none;

}

/* ------------------------------------------------------------------ rail */

.sim-rail {
  display: flex;
  flex-direction: column;
  /* Removing and replacing cards inside the fixed tray must not make Chrome
     compensate by scrolling the plan underneath it. */
  overflow-anchor: none;
  border: 1px solid var(--edge-c);
  border-radius: 0.75rem;
  background: var(--bg);
  font-size: 0.875rem;
  overflow: hidden;
}
@media (width >= 80rem) {
  .sim-rail {
    position: fixed;
    top: 2.75rem;
    right: 0;
    bottom: 0;
    width: 22rem;
    border-width: 0 0 0 1px;
    border-radius: 0;
  }
}


.sim-rail-head {

  align-items: baseline;
  gap: 0.5rem;
  padding: 0.7rem 0.9rem;
  border-bottom: 1px solid var(--edge-c);
}
.sim-rail-head h2 {

}
.sim-count {

.sim-rail-scroll {

}

.sim-empty {
  margin: 0;

}

.sim-cards,
.sim-receipts,
.sim-timeline {

}

/* One comment card. Edit and delete are icons in the top right rather than

   chrome each, and the reviewer accepted more truncation as the price. */

  padding: 0.5rem 0.6rem 0.6rem;

  border-left-width: 2px;
  border-radius: 0.5rem;
  background: var(--surface-c);
}
.sim-card[data-outcome="changed"] {
  border-left-color: var(--diff-add-c);
}
.sim-card[data-outcome="question"] {
  border-left-color: var(--callout-warning-c);
}
.sim-card[data-outcome="declined"] {
  border-left-color: var(--muted-c);

.sim-card-head {

  align-items: center;
  gap: 0.4rem;
  min-height: 1.35rem;
}
.sim-card-target {
  flex: 1 1 auto;

  color: var(--accent-c);
  font-size: 0.6875rem;
  font-weight: 600;

  text-overflow: ellipsis;
  text-transform: uppercase;
  white-space: nowrap;
}
.sim-card-target-button {
  border: 0;

}
.sim-card-target-button:hover {

}
.sim-card-target-button:active {

}
/* The element type survives only as a quiet secondary; the location is the
   label. */
.sim-card-detail {
  color: var(--muted-c);
  font-weight: 500;
  text-transform: none;
  letter-spacing: 0;
}

.sim-card-state {
  flex: 0 0 auto;
  color: var(--muted-c);
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.sim-card[data-outcome="changed"] /* The element type survives only as a quiet secondary; the location is the
   label. */
.sim-card-detail {
  color: var(--muted-c);
  font-weight: 500;
  text-transform: none;
  letter-spacing: 0;
}

.sim-card-state {

}
.sim-card[data-outcome="question"] /* The element type survives only as a quiet secondary; the location is the

.sim-card-detail {

}

/* The actions stay quiet until the card is hovered or focused within, so a
   tray of comments reads as text rather than as a row of controls. */
.sim-card-actions {
  display: flex;
  flex: 0 0 auto;
  gap: 0.15rem;

  transition: opacity 140ms ease;
}

.sim-icon-button {

}
.sim-icon-button:hover:not(:disabled),

}

}

}

.sim-card-body {

.sim-card-question {

/* --------------------------------------------------------- threads, turns */

.sim-turn {

.sim-timeline {

/* ----------------------------------------------------------------- tabs */

.sim-tabs {

.sim-tab[data-active] {

}
.sim-tab:hover {

}
.sim-tab:active {
  background: var(--sim-control-active);
}
.sim-tab-count {
  padding: 0 0.3rem;
  border-radius: 999px;
  background: var(--surface-c);
  font-size: 0.625rem;
  font-variant-numeric: tabular-nums;
}
.sim-tab-dot {
  width: 0.4rem;
  height: 0.4rem;
  border-radius: 999px;
  background: var(--callout-note-c);
}
.sim-conversation {
  margin-bottom: 0.5rem;
}

/* The base button. These rules were lost in an earlier rewrite of the card
   styles, which left every labelled button in all three mockups falling
   through to Tailwind's preflight - transparent background, zero border, zero
   radius, inherited colour - so a button rendered as bare text. Nothing was
   over-riding them; they simply were not there. */
.sim-row {
  display: flex;
  justify-content: flex-end;
  gap: 0.4rem;
  margin-top: 0.45rem;
}

.sim-button {
  padding: 0.28rem 0.65rem;
  border: 1px solid var(--edge-c);
  border-radius: 0.35rem;
  background: var(--bg);
  color: var(--muted-c);
  font: inherit;
  font-size: 0.75rem;
  cursor: pointer;
  transition:
    color 160ms ease,
    border-color 160ms ease;
}
.sim-button:hover:not(:disabled) {
  border-color: var(--muted-c);
  color: var(--ink-c);
}
.sim-button:active:not(:disabled) {
  background: var(--sim-control-active);
}
.sim-button:disabled {
  cursor: default;
  opacity: 0.55;
}
.sim-button-small {
  padding: 0.15rem 0.5rem;
}
.sim-button-primary {
  border-color: var(--accent-c);
  background: var(--accent-c);
  color: var(--bg);
  font-weight: 600;
}
.sim-button-primary:hover:not(:disabled) {

  filter: brightness(1.08);
}
.sim-button-primary:disabled {
  border-color: var(--edge-c);
  background: var(--surface-c);
  color: var(--muted-c);
}

.sim-send-bar {
  padding: 0.7rem 0.9rem;
  border-top: 1px solid var(--edge-c);
}
.sim-send {
  width: 100%;
  padding: 0.45rem 0.7rem;
  font-size: 0.8125rem;
}

/* ----------------------------------------------------------- agent panel */

.sim-agent {
  padding: 0.7rem 0.9rem 0.9rem;
  border-top: 1px solid var(--edge-c);
  background: var(--surface-c);
  overflow-y: auto;
}

.sim-agent-head {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  margin-bottom: 0.55rem;
}
.sim-agent-head h2 {
  margin: 0;
  font-size: 0.8125rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted-c);
}
.sim-chip {
  padding: 0.05rem 0.35rem;
  border: 1px dashed var(--muted-c);
  border-radius: 0.25rem;
  color: var(--muted-c);
  font-size: 0.5625rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.sim-badge {
  margin-left: auto;

  border-radius: 999px;

.sim-badge[data-tone="idle"] {

.sim-receipt {
  margin-bottom: 0.5rem;

  border-left-color: var(--diff-add-c);
}
.sim-receipt[data-outcome="question"] {
  border-left-color: var(--callout-warning-c);
}
.sim-receipt[data-outcome="declined"] {
  border-left-color: var(--muted-c);
}

.sim-receipt-head {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
}
.sim-receipt-target {
  flex: 1 1 auto;
  min-width: 0;
}
.sim-receipt-state {
  flex: 0 0 auto;
  color: var(--muted-c);
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.sim-receipt[data-outcome="changed"] .sim-receipt-state {
  color: var(--diff-add-c);
}
.sim-receipt[data-outcome="question"] .sim-receipt-state {
  color: var(--callout-warning-c);
}

.sim-receipt-step,
.sim-receipt-result {
  margin: 0.4rem 0 0;
  color: var(--muted-c);
  font-size: 0.75rem;
  line-height: 1.5;
}
.sim-receipt-step {
  display: flex;

  gap: 0.4rem;
  color: var(--callout-note-c);
}

/* A slow breath rather than a spinner: work in progress, calmly. */
.sim-pulse {
  width: 0.45rem;
  height: 0.45rem;

}
@keyframes sim-breathe {

.sim-thread {

/* ---------------------------------------------------------- fields, compose */

.sim-label {

-contents-row group -mx-2 grid grid-cols-[2rem_minmax(0,1fr)] items-baseline gap-x-[0.9rem] rounded-md px-2 py-1.5 no-underline"><span data-table-of-contents-num="true" class="text-xs font-medium text-muted">2.5</span><span class="table-of-contents-name block text-[0.9375rem] font-semibold text-ink group-hover:text-accent">Local architecture</span><span class="col-start-2 text-sm text-muted">One save path, one compare path, both offline</span></a><a data-table-of-contents-row="true" href="#trust-boundaries" class="table-of-contents-row group -mx-2 grid grid-cols-[2rem_minmax(0,1fr)] items-baseline gap-x-[0.9rem] rounded-md px-2 py-1.5 no-underline"><span data-table-of-contents-num="true" class="text-xs font-medium text-muted">2.6</span><span class="table-of-contents-name block text-[0.9375rem] font-semibold text-ink group-hover:text-accent">Trust boundaries</span><span class="col-start-2 text-sm text-muted">History is plan content; the store never becomes a path</span></a><a data-table-of-contents-row="true" href="#phased-delivery" class="table-of-contents-row group -mx-2 grid grid-cols-[2rem_minmax(0,1fr)] items-baseline gap-x-[0.9rem] rounded-md px-2 py-1.5 no-underline"><span data-table-of-contents-num="true" class="text-xs font-medium text-muted">2.7</span><span class="table-of-contents-name block text-[0.9375rem] font-semibold text-ink group-hover:text-accent">Phased delivery</span><span class="col-start-2 text-sm text-muted">Save first, compare second, navigate third</span></a><p data-table-of-contents-group="" class="table-of-contents-group mt-2.5 mb-0.5 text-xs font-semibold uppercase tracking-[0.1em] text-accent">[3] Shipping and your review</p><a data-table-of-contents-row="true" href="#open-decisions" class="table-of-contents-row group -mx-2 grid grid-cols-[2rem_minmax(0,1fr)] items-baseline gap-x-[0.9rem] rounded-md px-2 py-1.5 no-underline"><span data-table-of-contents-num="true" class="text-xs font-medium text-muted">3.1</span><span class="table-of-con <div data-part="true" data-part-title="Context" id="part-context" class="plan-part mt-[3.8rem] mb-[1.3rem] flex items-baseline gap-3 rounded-[0.6rem] bg-surface px-[1.1rem] py-[0.55rem]" data-component="Part" data-block-id="document/part-1" data-block-kind="part" data-block-label="Part 1Context"><span data-part-number="true" class="text-[0.8125rem] font-bold tracking-[0.1em] whitespace-nowrap uppercase text-accent">Part 1</span><span class="text-[1.45rem] leading-tight font-bold text-ink">Context</span></div>
<section data-slide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><p data-slide-kicker="" class="plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent">1.1 / Status quo</p><h2 id="status-quo" data-block-id="section/status-quo/heading-1" data-block-kind="heading" data-block-label="Status quo">Status quo</h2>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/status-quo/paragraph-1" data-block-kind="paragraph" data-block-label="What a reviewer can and cannot do today when a plan is revised.">What a reviewer can and cannot do today when a plan is revised.</p>
<p data-block-id="section/status-quo/paragraph-2" data-block-kind="paragraph" data-block-label="What works today"><strong>What works today</strong></p>
<ul data-block-id="section/status-quo/list-1" data-block-kind="list" data-block-label="The plan source is authoritative. Big Plan renders from the MDX on disk…">
<li><strong>The plan source is authoritative.</strong> Big Plan renders from the MDX on disk, so what a reviewer reads is always what the agent will build from.</li>
<li><strong>The document is a good place to read.</strong> Sections carry numbered kickers, the navigation tracks where the reader is, and the reading column stays quiet.</li>
<li><strong>Feedback now reaches the agent.</strong> A reviewer can comment on a block or a span of text and send one package the agent applies to the plan source.</li>
</ul>
<p data-block-id="section/status-quo/paragraph-3" data-block-kind="paragraph" data-block-label="Where the loop breaks"><strong>Where the loop breaks</strong></p>
<p data-block-id="section/status-quo/paragraph-4" data-block-kind="paragraph" data-block-label="Applying feedback overwrites the plan in place. The next render is a ne…">Applying feedback overwrites the plan in place.
The next render is a new document with no memory of the one before it, so the reviewer who asked for a change cannot see the change they asked for.
They re-read the whole plan and compare it against what they remember.</p>
<blockquote data-block-id="section/status-quo/quote-1" data-block-kind="quote" data-block-label="Aside: this is the same gap a code review would have without a diff. No…">
<p><em>Aside: this is the same gap a code review would have without a diff. Nobody reviews code by re-reading the file and recalling the old one.</em></p>
</blockquote>
<p data-block-id="section/status-quo/paragraph-5" data-block-kind="paragraph" data-block-label="Why it matters more here than in prose"><strong>Why it matters more here than in prose</strong></p>
<p data-block-id="section/status-quo/paragraph-6" data-block-kind="paragraph" data-block-label="A plan is the artifact a human accepts before execution begins. Accepta…">A plan is the artifact a human accepts before execution begins.
Acceptance means "I understand what will be built", and a reviewer cannot honestly say that about a document that silently changed since they last read it.</p>
</section><section data-slide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><p data-slide-kicker="" class="plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent">1.2 / Success looks like</p><h2 id="success-looks-like" data-block-id="section/success-looks-like/heading-1" data-block-kind="heading" data-block-label="Success looks like">Success looks like</h2>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/success-looks-like/paragraph-1" data-block-kind="paragraph" data-block-label="What a reviewer should be able to say after a month of revising plans.">What a reviewer should be able to say after a month of revising plans.</p>
<p data-block-id="section/success-looks-like/paragraph-2" data-block-kind="paragraph" data-block-label="See the change, not the document"><strong>See the change, not the document</strong></p>
<ul data-block-id="section/success-looks-like/list-1" data-block-kind="list" data-block-label="When I reopen a plan the agent revised, I can see what changed since I…">
<li>When I reopen a plan the agent revised, I can see what changed since I last read it without re-reading anything.</li>
<li>A difference tells me a section was rewritten, moved, or added - not that 40 lines changed.</li>
</ul>
<p data-block-id="section/success-looks-like/paragraph-3" data-block-kind="paragraph" data-block-label="Trust the history"><strong>Trust the history</strong></p>
<ul data-block-id="section/success-looks-like/list-2" data-block-kind="list" data-block-label="Every revision the agent made is still on disk, in order, with the reas…">
<li>Every revision the agent made is still on disk, in order, with the reason it was made.</li>
<li>Nothing I accepted has quietly disappeared.</li>
</ul>
<p data-block-id="section/success-looks-like/paragraph-4" data-block-kind="paragraph" data-block-label="Stay in the document"><strong>Stay in the document</strong></p>
<ul data-block-id="section/success-looks-like/list-3" data-block-kind="list" data-block-label="I read the difference in the same reading column as the plan, not in a…">
<li>I read the difference in the same reading column as the plan, not in a terminal and not in another tool.</li>
<li>I can go back to reading the whole plan in one action.</li>
</ul>
<p data-block-id="section/success-looks-like/paragraph-5" data-block-kind="paragraph" data-block-label="Keep it local"><strong>Keep it local</strong></p>
<ul data-block-id="section/success-looks-like/list-4" data-block-kind="list" data-block-label="History lives beside the plan, needs no account, and never leaves the m…">
<li>History lives beside the plan, needs no account, and never leaves the machine.</li>
</ul>
<aside data-callout="note" class="callout mb-5 rounded-md border border-l-4 px-4 py-3" data-component="Callout" data-block-id="section/success-looks-like/callout-1" data-block-kind="callout" data-block-label="Versioning serves review, not source controlThis is reading history for…"><header class="callout-header mb-2 flex items-center gap-2 font-semibold [&#x26;_svg]:size-4 [&#x26;_svg]:shrink-0"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="info"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg><span class="callout-title text-sm leading-5">Versioning serves review, not source control</span></header><div class="callout-body text-ink"><p>This is reading history for a human mid-review, not a replacement for git.
A plan tracked in git keeps its git history; a plan that is not tracked still gets one a reviewer can read.</p></div></aside>
</section><div data-part="true" data-part-title="The proposal" id="part-the-proposal" class="plan-part mt-[3.8rem] mb-[1.3rem] flex items-baseline gap-3 rounded-[0.6rem] bg-surface px-[1.1rem] py-[0.55rem]" data-component="Part" data-block-id="document/part-2" data-block-kind="part" data-block-label="Part 2The proposal"><span data-part-number="true" class="text-[0.8125rem] font-bold tracking-[0.1em] whitespace-nowrap uppercase text-accent">Part 2</span><span class="text-[1.45rem] leading-tight font-bold text-ink">The proposal</span></div>
<div data-subpart="" class="plan-subpart mt-12 mb-4"><p data-slide-kicker="" class="plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent">2.1 / What a version is</p><h2 id="what-a-version-is" data-block-id="section/what-a-version-is/heading-1" data-block-kind="heading" data-block-label="What a version is">What a version is</h2>
<p data-block-id="section/what-a-version-is/paragraph-1" data-block-kind="paragraph" data-block-label="The unit everything else in this plan is built on."><em>The unit everything else in this plan is built on.</em></p>
<p data-block-id="section/what-a-version-is/paragraph-2" data-block-kind="paragraph" data-block-label="The problem. &#x22;Version&#x22; is a word that means five different things depen…"><strong>The problem.</strong> "Version" is a word that means five different things depending on who says it, so the plan pins down exactly one meaning before designing anything around it.</p>
<p data-block-id="section/what-a-version-is/paragraph-3" data-block-kind="paragraph" data-block-label="The model. A version is one complete, immutable snapshot of a plan&#x27;s MD…"><strong>The model.</strong> A version is one complete, immutable snapshot of a plan's MDX source, taken at a moment the plan was worth remembering, carrying why it was taken.</p>
</div><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="a-version-records-a-revision-not-a-keystroke" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/a-version-records-a-revision-not-a-keystroke/heading-1" data-block-kind="heading" data-block-label="A version records a revision, not a keystroke">2.1.1 / A version records a revision, not a keystroke</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/a-version-records-a-revision-not-a-keystroke/paragraph-1" data-block-kind="paragraph" data-block-label="Snapshotting on every edit would bury the reviewer in noise.">Snapshotting on every edit would bury the reviewer in noise.</p>
<p data-block-id="section/a-version-records-a-revision-not-a-keystroke/paragraph-2" data-block-kind="paragraph" data-block-label="A version is cut when a unit of work on the plan completes, not when a…">A version is cut when a unit of work on the plan completes, not when a character changes:</p>
<ul data-block-id="section/a-version-records-a-revision-not-a-keystroke/list-1" data-block-kind="list" data-block-label="After the agent applies a feedback package. One package produces one ve…">
<li><strong>After the agent applies a feedback package.</strong> One package produces one version, so "what changed because of my comments" is answerable by construction.</li>
<li><strong>Before the agent's first edit of a session.</strong> The plan as the reviewer last saw it is preserved before anything touches it.</li>
<li><strong>On explicit request.</strong> The author asks for one when they want a mark in the history.</li>
</ul>
<p data-block-id="section/a-version-records-a-revision-not-a-keystroke/paragraph-3" data-block-kind="paragraph" data-block-label="[CONSTRAINT] A version is immutable once written. A correction produces…"><strong>[CONSTRAINT]</strong> A version is immutable once written. A correction produces a new version; it never edits an old one.</p>
</section><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="what-a-version-carries" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/what-a-version-carries/heading-1" data-block-kind="heading" data-block-label="What a version carries">2.1.2 / What a version carries</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/what-a-version-carries/paragraph-1" data-block-kind="paragraph" data-block-label="The metadata a reviewer needs to choose between two versions.">The metadata a reviewer needs to choose between two versions.</p>
<div data-table-scroll-container="" class="mb-5 overflow-x-auto rounded-md border border-edge" data-block-id="section/what-a-version-carries/table-1" data-block-kind="table" data-block-label="Field What it holds Why a reviewer needs it versionId Content hash of t…"><table>
<thead>
<tr>
<th>Field</th>
<th>What it holds</th>
<th>Why a reviewer needs it</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>versionId</code></td>
<td>Content hash of the snapshot</td>
<td>Two identical revisions are one version, so an idle re-render adds nothing</td>
</tr>
<tr>
<td><code>number</code></td>
<td>Position in this plan's history</td>
<td>The reviewer says "version 4", not a hash</td>
</tr>
<tr>
<td><code>createdAt</code></td>
<td>When it was written</td>
<td>Orders the history and answers "since Tuesday"</td>
</tr>
<tr>
<td><code>reason</code></td>
<td>Why it was cut</td>
<td>"Applied feedback package 9a2f4b81" beats "modified"</td>
</tr>
<tr>
<td><code>feedbackPackageId</code></td>
<td>The package this revision answered</td>
<td>Links a change back to the comment that asked for it</td>
</tr>
<tr>
<td><code>parent</code></td>
<td>The version it revised</td>
<td>Makes the history a chain rather than a pile</td>
</tr>
</tbody>
</table></div>
</section><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="what-a-version-is-not" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/what-a-version-is-not/heading-1" data-block-kind="heading" data-block-label="What a version is not">2.1.3 / What a version is not</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/what-a-version-is-not/paragraph-1" data-block-kind="paragraph" data-block-label="The boundaries that keep the store small and the concept clear.">The boundaries that keep the store small and the concept clear.</p>
<ul data-block-id="section/what-a-version-is-not/list-1" data-block-kind="list" data-block-label="Not the rendered HTML. A document is derived and can always be re-rende…">
<li>Not the rendered HTML. A document is derived and can always be re-rendered from its snapshot.</li>
<li>Not the reviewer's drafts or feedback packages. Those are review state and live where review state already lives.</li>
<li>Not a branch. One plan has one linear history; concurrent editing is out of scope.</li>
</ul>
</section><div data-subpart="" class="plan-subpart mt-12 mb-4"><p data-slide-kicker="" class="plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent">2.2 / The version store</p><h2 id="the-version-store" data-block-id="section/the-version-store/heading-1" data-block-kind="heading" data-block-label="The version store">The version store</h2>
<p data-block-id="section/the-version-store/paragraph-1" data-block-kind="paragraph" data-block-label="Where history lives, and what it costs."><em>Where history lives, and what it costs.</em></p>
<p data-block-id="section/the-version-store/paragraph-2" data-block-kind="paragraph" data-block-label="The problem. A plan is revised many times in one review, and a naive st…"><strong>The problem.</strong> A plan is revised many times in one review, and a naive store either loses history or fills the reviewer's disk with near-identical copies.</p>

</section><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="the-store-is-scoped-to-one-plan" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/the-store-is-scoped-to-one-plan/heading-1" data-block-kind="heading" data-block-label="The store is scoped to one plan">2.2.2 / The store is scoped to one plan</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/the-store-is-scoped-to-one-plan/paragraph-1" data-block-kind="paragraph" data-block-label="History follows the plan, not the directory.">History follows the plan, not the directory.</p>
<p data-block-id="section/the-store-is-scoped-to-one-plan/paragraph-2" data-block-kind="paragraph" data-block-label="The versions/ directory is namespaced by the plan&#x27;s renderer-stamped id…">The <code>versions/</code> directory is namespaced by the plan's renderer-stamped id, exactly as draft comments already are.
Two plans that share a directory - or a title - never share a history.</p>
<p data-block-id="section/the-store-is-scoped-to-one-plan/paragraph-3" data-block-kind="paragraph" data-block-label="[CONSTRAINT] Every path under versions/ is built from the plan&#x27;s own id…"><strong>[CONSTRAINT]</strong> Every path under <code>versions/</code> is built from the plan's own id and a content hash. No text a reviewer or a plan author wrote ever becomes a path segment.</p>
</section><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="retention-keeps-history-readable" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/retention-keeps-history-readable/heading-1" data-block-kind="heading" data-block-label="Retention keeps history readable">2.2.3 / Retention keeps history readable</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/retention-keeps-history-readable/paragraph-1" data-block-kind="paragraph" data-block-label="An unbounded history is a history nobody reads.">An unbounded history is a history nobody reads.</p>
<p data-block-id="section/retention-keeps-history-readable/paragraph-2" data-block-kind="paragraph" data-block-label="The store keeps every version by default, because a plan&#x27;s whole revisi…">The store keeps every version by default, because a plan's whole revision history is small compared with one screenshot.
Retention becomes a decision only when a plan's history grows past a threshold worth naming, which is the <strong>Open decisions</strong> call below.</p>
</section><div data-subpart="" class="plan-subpart mt-12 mb-4"><p data-slide-kicker="" class="plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent">2.3 / Reading a difference</p><h2 id="reading-a-difference" data-block-id="section/reading-a-difference/heading-1" data-block-kind="heading" data-block-label="Reading a difference">Reading a difference</h2>
<p data-block-id="section/reading-a-difference/paragraph-1" data-block-kind="paragraph" data-block-label="The heart of the feature: what the reviewer actually sees."><em>The heart of the feature: what the reviewer actually sees.</em></p>
<p data-block-id="section/reading-a-difference/paragraph-2" data-block-kind="paragraph" data-block-label="The problem. A textual diff of an MDX plan is a bad review surface. It…"><strong>The problem.</strong> A textual diff of an MDX plan is a bad review surface. It shows re-wrapped sentences as changes, splits one moved section into a deletion and an addition far apart, and buries a rewritten decision inside noise.</p>
</div><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="a-difference-is-structural-not-textual" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/a-difference-is-structural-not-textual/heading-1" data-block-kind="heading" data-block-label="A difference is structural, not textual">2.3.1 / A difference is structural, not textual</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/a-difference-is-structural-not-textual/paragraph-1" data-block-kind="paragraph" data-block-label="The comparison happens over blocks, using the identity the renderer alr…">The comparison happens over blocks, using the identity the renderer already mints.</p>
<p data-block-id="section/a-difference-is-structural-not-textual/paragraph-2" data-block-kind="paragraph" data-block-label="Commenting gave every block in a rendered plan a stable structural addr…">Commenting gave every block in a rendered plan a stable structural address.
Comparing two versions reuses that address, so a difference is expressed in the reader's own vocabulary:</p>
<ul data-block-id="section/a-difference-is-structural-not-textual/list-1" data-block-kind="list" data-block-label="Added - a block exists in the newer version and not the older. Removed…">
<li><strong>Added</strong> - a block exists in the newer version and not the older.</li>
<li><strong>Removed</strong> - the reverse.</li>
<li><strong>Rewritten</strong> - the same address, different content.</li>
<li><strong>Moved</strong> - the same content, different address.</li>
<li><strong>Unchanged</strong> - shown collapsed by default, so the reader's attention goes where the change is.</li>
</ul>
<p data-block-id="section/a-difference-is-structural-not-textual/paragraph-3" data-block-kind="paragraph" data-block-label="[CONSTRAINT] A difference never re-flows or re-wraps a block to make it…"><strong>[CONSTRAINT]</strong> A difference never re-flows or re-wraps a block to make it match. Two blocks are the same block because they share an address or their content, never because their text is similar enough.</p>
<p data-block-id="section/a-difference-is-structural-not-textual/paragraph-4" data-block-kind="paragraph" data-block-label="The address is the descriptor the renderer already mints for every comm…">The address is the descriptor the renderer already mints for every commentable unit, so comparison is its second consumer rather than a new concept:</p>

</section><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="the-difference-reads-as-a-document" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/the-difference-reads-as-a-document/heading-1" data-block-kind="heading" data-block-label="The difference reads as a document">2.3.2 / The difference reads as a document</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/the-difference-reads-as-a-document/paragraph-1" data-block-kind="paragraph" data-block-label="The comparison is presented as the plan, annotated - not as two columns…">The comparison is presented as the plan, annotated - not as two columns of code.</p>
<p data-block-id="section/the-difference-reads-as-a-document/paragraph-2" data-block-kind="paragraph" data-block-label="The reviewer reads the newer version top to bottom in the ordinary read…">The reviewer reads the newer version top to bottom in the ordinary reading column.
Changed blocks carry a marker in the margin and a tone; unchanged runs collapse to a single quiet line the reader can expand.</p>
<ul data-block-id="section/the-difference-reads-as-a-document/list-1" data-block-kind="list" data-block-label="A rewritten block shows the older text beneath the newer one, quieter,…">
<li>A rewritten block shows the older text beneath the newer one, quieter, so the reader sees the change without leaving the sentence.</li>
<li>A moved block names where it came from ("was in <em>Status quo</em>"), so a reorganisation reads as one fact.</li>
<li>A changed component - a decision, a table, a diagram - is marked whole rather than picked apart, because the component is the unit the reviewer argued with.</li>
</ul>
</section><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="every-change-names-its-cause-where-one-exists" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/every-change-names-its-cause-where-one-exists/heading-1" data-block-kind="heading" data-block-label="Every change names its cause where one exists">2.3.3 / Every change names its cause where one exists</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/every-change-names-its-cause-where-one-exists/paragraph-1" data-block-kind="paragraph" data-block-label="The most valuable line in a difference is why.">The most valuable line in a difference is why.</p>
<p data-block-id="section/every-change-names-its-cause-where-one-exists/paragraph-2" data-block-kind="paragraph" data-block-label="When a version was cut by applying a feedback package, each changed blo…">When a version was cut by applying a feedback package, each changed block links back to the comment whose target it was.
A reviewer reading their own revision sees "you asked for this" against the block, which is the shortest path from feedback to trust.</p>
<aside data-callout="tip" class="callout mb-5 rounded-md border border-l-4 px-4 py-3" data-component="Callout" data-block-id="section/every-change-names-its-cause-where-one-exists/callout-1" data-block-kind="callout" data-block-label="This is what makes versioning worth buildingSeeing that a plan changed…"><header class="callout-header mb-2 flex items-center gap-2 font-semibold [&#x26;_svg]:size-4 [&#x26;_svg]:shrink-0"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="lightbulb"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.09 14c.18-.32.42-.65.66-.91A6 6 0 1 0 8.25 13.09c.25.25.48.58.66.91"></path></svg><span class="callout-title text-sm leading-5">This is what makes versioning worth building</span></header><div class="callout-body text-ink"><p>Seeing that a plan changed is useful.
Seeing that it changed <em>because of the comment you left</em>, on the block you left it on, is the thing that makes a review loop feel closed.</p></div></aside>
</section><div data-subpart="" class="plan-subpart mt-12 mb-4"><p data-slide-kicker="" class="plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent">2.4 / Choosing what to compare</p><h2 id="choosing-what-to-compare" data-block-id="section/choosing-what-to-compare/heading-1" data-block-kind="heading" data-block-label="Choosing what to compare">Choosing what to compare</h2>
<p data-block-id="section/choosing-what-to-compare/paragraph-1" data-block-kind="paragraph" data-block-label="How the reviewer gets from a plan to a difference."><em>How the reviewer gets from a plan to a difference.</em></p>
<p data-block-id="section/choosing-what-to-compare/paragraph-2" data-block-kind="paragraph" data-block-label="The problem. Two versions is a two-value selection, and most version pi…"><strong>The problem.</strong> Two versions is a two-value selection, and most version pickers make that feel like operating a machine rather than reading a document.</p>
</div><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="one-picker-two-defaults-no-modes" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/one-picker-two-defaults-no-modes/heading-1" data-block-kind="heading" data-block-label="One picker, two defaults, no modes">2.4.1 / One picker, two defaults, no modes</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/one-picker-two-defaults-no-modes/paragraph-1" data-block-kind="paragraph" data-block-label="The reviewer names a starting point; the newest version is almost alway…">The reviewer names a starting point; the newest version is almost always the other end.</p>
<p data-block-id="section/one-picker-two-defaults-no-modes/paragraph-2" data-block-kind="paragraph" data-block-label="The picker sits in the document&#x27;s chrome beside the navigation and offe…">The picker sits in the document's chrome beside the navigation and offers the two comparisons a reviewer actually wants:</p>
<ul data-block-id="section/one-picker-two-defaults-no-modes/list-1" data-block-kind="list" data-block-label="Since I last read it - the default, and the one that needs no thought.…">
<li><strong>Since I last read it</strong> - the default, and the one that needs no thought. The document remembers the newest version this reviewer opened.</li>
<li><strong>Since a chosen version</strong> - a short list of versions by number, time, and reason.</li>
</ul>
<p data-block-id="section/one-picker-two-defaults-no-modes/paragraph-3" data-block-kind="paragraph" data-block-label="The other end of the comparison is always the version currently open, s…">The other end of the comparison is always the version currently open, so there is one thing to choose rather than two.</p>
</section><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="reading-history-is-not-reading-a-plan" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/reading-history-is-not-reading-a-plan/heading-1" data-block-kind="heading" data-block-label="Reading history is not reading a plan">2.4.2 / Reading history is not reading a plan</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/reading-history-is-not-reading-a-plan/paragraph-1" data-block-kind="paragraph" data-block-label="Entering a comparison changes the document, so it says so plainly.">Entering a comparison changes the document, so it says so plainly.</p>
<ul data-block-id="section/reading-history-is-not-reading-a-plan/list-1" data-block-kind="list" data-block-label="A banner states which two versions are being compared and offers one ac…">
<li>A banner states which two versions are being compared and offers one action back to reading the whole plan.</li>
<li>Section navigation keeps working, so a reviewer can jump to the section they care about inside the difference.</li>
<li>Commenting stays available: a reviewer looking at what changed is exactly the reviewer most likely to have something to say.</li>
</ul>
</section><div data-subpart="" class="plan-subpart mt-12 mb-4"><p data-slide-kicker="" class="plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent">2.5 / Local architecture</p><h2 id="local-architecture" data-block-id="section/local-architecture/heading-1" data-block-kind="heading" data-block-label="Local architecture">Local architecture</h2>

</div><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="two-paths-one-store" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/two-paths-one-store/heading-1" data-block-kind="heading" data-block-label="Two paths, one store">2.5.1 / Two paths, one store</h3>

class="flow-diagram-fork-rail" aria-hidden="true"></span><span class="absolute top-[calc(50%-1.35rem)] left-3/4 -translate-x-1/2 text-[0.6875rem] whitespace-nowrap text-muted">renders</span></div><div data-flow-diagram-branch="last" class="flow-diagram-fork-branch relative self-stretch" style="grid-column:6;grid-row:3"><span class="flow-diagram-fork-rail" aria-hidden="true"></span><span class="absolute top-[calc(50%-1.35rem)] left-3/4 -translate-x-1/2 text-[0.6875rem] whitespace-nowrap text-muted">reports</span></div></div><p data-flow-diagram-footer="true" class="mt-[0.9rem] mb-0 text-center text-[0.8125rem] text-muted">Comparison never reads the rendered HTML; it compiles both snapshots and matches their blocks.</p></div>
</section><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="the-commands-a-version-history-needs" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/the-commands-a-version-history-needs/heading-1" data-block-kind="heading" data-block-label="The commands a version history needs">2.5.2 / The commands a version history needs</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/the-commands-a-version-history-needs/paragraph-1" data-block-kind="paragraph" data-block-label="Three verbs, matching the three things a person or an agent does with h…">Three verbs, matching the three things a person or an agent does with history.</p>
<div data-table-scroll-container="" class="mb-5 overflow-x-auto rounded-md border border-edge" data-block-id="section/the-commands-a-version-history-needs/table-1" data-block-kind="table" data-block-label="Command Who runs it What it does big-plan version save <plan.mdx> The a…"><table>
<thead>
<tr>
<th>Command</th>
<th>Who runs it</th>
<th>What it does</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>big-plan version save &#x3C;plan.mdx></code></td>
<td>The agent, after applying feedback</td>
<td>Writes a snapshot and records its reason</td>
</tr>
<tr>
<td><code>big-plan version list &#x3C;plan.mdx></code></td>
<td>Either</td>
<td>Prints the history as machine-readable JSON</td>
</tr>
<tr>
<td><code>big-plan version diff &#x3C;plan.mdx> --since &#x3C;n></code></td>
<td>Either</td>
<td>Renders the difference, or reports it as JSON</td>
</tr>
</tbody>
</table></div>
<p data-block-id="section/the-commands-a-version-history-needs/paragraph-2" data-block-kind="paragraph" data-block-label="The review runtime calls the same code rather than a second implementat…">The review runtime calls the same code rather than a second implementation, so the difference a reviewer reads in the browser is the difference an agent reads on the command line.</p>
</section><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="the-comparison-is-pure" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/the-comparison-is-pure/heading-1" data-block-kind="heading" data-block-label="The comparison is pure">2.5.3 / The comparison is pure</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/the-comparison-is-pure/paragraph-1" data-block-kind="paragraph" data-block-label="Everything that decides what changed is a function of two snapshots.">Everything that decides what changed is a function of two snapshots.</p>
<p data-block-id="section/the-comparison-is-pure/paragraph-2" data-block-kind="paragraph" data-block-label="Matching blocks, classifying changes, and ordering them are pure over t…">Matching blocks, classifying changes, and ordering them are pure over two compiled plans.
Only the store reads the disk, and only the delivery step produces a document.
That keeps the interesting half unit-testable and keeps a difference reproducible: the same two versions always produce the same reading.</p>
</section><div data-subpart="" class="plan-subpart mt-12 mb-4"><p data-slide-kicker="" class="plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent">2.6 / Trust boundaries</p><h2 id="trust-boundaries" data-block-id="section/trust-boundaries/heading-1" data-block-kind="heading" data-block-label="Trust boundaries">Trust boundaries</h2>
<p data-block-id="section/trust-boundaries/paragraph-1" data-block-kind="paragraph" data-block-label="What history changes about the plan&#x27;s threat model, and what it does no…"><em>What history changes about the plan's threat model, and what it does not.</em></p>
<p data-block-id="section/trust-boundaries/paragraph-2" data-block-kind="paragraph" data-block-label="The problem. History multiplies the plan content sitting on disk and in…"><strong>The problem.</strong> History multiplies the plan content sitting on disk and introduces a second thing an agent reads, so the boundaries commenting established need re-checking rather than assuming.</p>
</div><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="snapshots-are-plan-content" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/snapshots-are-plan-content/heading-1" data-block-kind="heading" data-block-label="Snapshots are plan content">2.6.1 / Snapshots are plan content</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/snapshots-are-plan-content/paragraph-1" data-block-kind="paragraph" data-block-label="A version is as sensitive as the plan it copies, and often more so.">A version is as sensitive as the plan it copies, and often more so.</p>
<ul data-block-id="section/snapshots-are-plan-content/list-1" data-block-kind="list" data-block-label="[CONSTRAINT] versions/ is created owner-readable only and ignored by ve…">
<li><strong>[CONSTRAINT]</strong> <code>versions/</code> is created owner-readable only and ignored by version control by default, exactly as <code>review/</code> and <code>feedback/</code> already are.</li>
<li><strong>[CONSTRAINT]</strong> Nothing in the store leaves the machine. Reading a difference issues no request to any origin but the local review runtime's own.</li>
</ul>
</section><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="a-snapshot-on-disk-is-untrusted-input" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/a-snapshot-on-disk-is-untrusted-input/heading-1" data-block-kind="heading" data-block-label="A snapshot on disk is untrusted input">2.6.2 / A snapshot on disk is untrusted input</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/a-snapshot-on-disk-is-untrusted-input/paragraph-1" data-block-kind="paragraph" data-block-label="The store is writable by anything running as the reviewer.">The store is writable by anything running as the reviewer.</p>
<ul data-block-id="section/a-snapshot-on-disk-is-untrusted-input/list-1" data-block-kind="list" data-block-label="[CONSTRAINT] A snapshot is re-validated through the ordinary compiler b…">
<li><strong>[CONSTRAINT]</strong> A snapshot is re-validated through the ordinary compiler before it is compared or rendered. A file in <code>objects/</code> is not proof the agent wrote it.</li>
<li><strong>[CONSTRAINT]</strong> A snapshot that no longer compiles is reported to the reviewer as an unreadable version, never rendered partially and never skipped silently.</li>
</ul>
</section><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="a-difference-is-data-never-instruction" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/a-difference-is-data-never-instruction/heading-1" data-block-kind="heading" data-block-label="A difference is data, never instruction">2.6.3 / A difference is data, never instruction</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/a-difference-is-data-never-instruction/paragraph-1" data-block-kind="paragraph" data-block-label="Old plan text is the same kind of untrusted content a comment body is.">Old plan text is the same kind of untrusted content a comment body is.</p>
<ul data-block-id="section/a-difference-is-data-never-instruction/list-1" data-block-kind="list" data-block-label="[CONSTRAINT] Text from either version reaches the document as text. The…">
<li><strong>[CONSTRAINT]</strong> Text from either version reaches the document as text. The difference view introduces no new markup path for plan content.</li>
<li><strong>[CONSTRAINT]</strong> A version's <code>reason</code> is reviewer- or agent-supplied text and is shown as text, so a reason can never become chrome.</li>
</ul>
</section><div data-subpart="" class="plan-subpart mt-12 mb-4"><p data-slide-kicker="" class="plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent">2.7 / Phased delivery</p><h2 id="phased-delivery" data-block-id="section/phased-delivery/heading-1" data-block-kind="heading" data-block-label="Phased delivery">Phased delivery</h2>
<p data-block-id="section/phased-delivery/paragraph-1" data-block-kind="paragraph" data-block-label="Sequence so history exists before anyone has to read it."><em>Sequence so history exists before anyone has to read it.</em></p>
</div><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="phase-1---save-versions" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/phase-1-save-versions/heading-1" data-block-kind="heading" data-block-label="Phase 1 - Save versions">2.7.1 / Phase 1 - Save versions</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/phase-1-save-versions/paragraph-1" data-block-kind="paragraph" data-block-label="History starts accumulating before any of it can be read.">History starts accumulating before any of it can be read.</p>
<ul data-block-id="section/phase-1-save-versions/list-1" data-block-kind="list" data-block-label="The store, the index, and content-addressed snapshots. big-plan version…">
<li>The store, the index, and content-addressed snapshots.</li>
<li><code>big-plan version save</code> and <code>big-plan version list</code>.</li>
<li>The review runtime cuts a version before the agent's first edit of a session.</li>
<li>Success is "no revision is lost", not "a reviewer can see it".</li>
</ul>
</section><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="phase-2---read-a-difference" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/phase-2-read-a-difference/heading-1" data-block-kind="heading" data-block-label="Phase 2 - Read a difference">2.7.2 / Phase 2 - Read a difference</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/phase-2-read-a-difference/paragraph-1" data-block-kind="paragraph" data-block-label="The reading surface, over history Phase 1 already collected.">The reading surface, over history Phase 1 already collected.</p>
<ul data-block-id="section/phase-2-read-a-difference/list-1" data-block-kind="list" data-block-label="Structural block matching and the added / removed / rewritten / moved c…">
<li>Structural block matching and the added / removed / rewritten / moved classification.</li>
<li>The annotated document, collapsed unchanged runs, and the comparison banner.</li>
<li><code>big-plan version diff</code> for agents and terminals.</li>
</ul>
</section><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="phase-3---navigate-history" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/phase-3-navigate-history/heading-1" data-block-kind="heading" data-block-label="Phase 3 - Navigate history">2.7.3 / Phase 3 - Navigate history</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/phase-3-navigate-history/paragraph-1" data-block-kind="paragraph" data-block-label="The parts that make a long history usable.">The parts that make a long history usable.</p>
<ul data-block-id="section/phase-3-navigate-history/list-1" data-block-kind="list" data-block-label="The picker, &#x22;since I last read it&#x22;, and the per-reviewer read mark. Lin…">
<li>The picker, "since I last read it", and the per-reviewer read mark.</li>
<li>Linking a changed block back to the comment that asked for it.</li>
<li>Retention, once a real history has shown how large one gets.</li>
</ul>
</section><div data-part="true" data-part-title="Shipping and your review" id="part-shipping-and-your-review" class="plan-part mt-[3.8rem] mb-[1.3rem] flex items-baseline gap-3 rounded-[0.6rem] bg-surface px-[1.1rem] py-[0.55rem]" data-component="Part" data-block-id="document/part-3" data-block-kind="part" data-block-label="Part 3Shipping and your review"><span data-part-number="true" class="text-[0.8125rem] font-bold tracking-[0.1em] whitespace-nowrap uppercase text-accent">Part 3</span><span class="text-[1.45rem] leading-tight font-bold text-ink">Shipping and your review</span></div>
<div data-subpart="" class="plan-subpart mt-12 mb-4"><p data-slide-kicker="" class="plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent">3.1 / Open decisions</p><h2 id="open-decisions" data-block-id="section/open-decisions/heading-1" data-block-kind="heading" data-block-label="Open decisions">Open decisions</h2>
<p data-block-id="section/open-decisions/paragraph-1" data-block-kind="paragraph" data-block-label="Choices that need a call before Phase 2 commits."><em>Choices that need a call before Phase 2 commits.</em></p>
</div><section data-slide="" data-subslide="" class="plan-slide mb-6 rounded-xl border border-edge px-5 py-5 wide:px-[2.1rem] wide:py-[1.9rem]"><h3 id="how-a-difference-is-expressed" data-slide-kicker="" class="mt-0 plan-slide-kicker mb-[0.45rem] text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-accent" data-block-id="section/how-a-difference-is-expressed/heading-1" data-block-kind="heading" data-block-label="How a difference is expressed">3.1.1 / How a difference is expressed</h3>
<p data-slide-context="" class="plan-slide-context -mt-[0.2rem] mb-[0.9rem] text-[0.9375rem] text-muted" data-block-id="section/how-a-difference-is-expressed/paragraph-1" data-block-kind="paragraph" data-block-label="We need to decide the comparison model before block matching is written.">We need to decide the comparison model before block matching is written.</p>
<aside data-decision="true" data-decision-status="open" class="mb-6 rounded-lg border border-edge px-5 py-4" data-component="Decision" data-block-id="section/how-a-difference-is-expressed/decision-1" data-block-kind="decision" data-block-label="What is the unit of comparison between two plan versions?"><header class="mb-2 flex flex-wrap items-baseline gap-x-2"><p class="m-0 text-xs font-semibold tracking-[0.08em] uppercase text-muted">Decision</p><span class="decision-status-pill rounded-full px-2 py-0.5 text-xs font-medium">open</span></header><h3 class="mt-0 mb-2 text-2xl font-bold">What is the unit of comparison between two plan versions?</h3><div class="mb-4 text-muted [&#x26;>:last-child]:mb-0"><p>The unit decides what a reviewer sees, what the code has to compute, and how badly a reorganisation reads.</p></div><section data-decision-option="true" data-option-recommended="" class="decision-option mb-4 rounded-lg border border-edge px-5 py-4 last:mb-0"><header class="mb-1 flex flex-wrap items-center gap-x-3"><h4 class="m-0 text-lg font-semibold">Structural block matching</h4><span class="decision-recommended-pill rounded-full px-2 py-0.5 text-xs font-semibold">Recommended</span></header><p class="mb-0 text-muted">Compare compiled blocks by their renderer-minted addresses, then by content.</p><ul class="mt-3 mb-0 list-none space-y-2 border-t border-edge p-0 pt-3 text-[0.9375rem]"><li class="m-0 leading-relaxed"><span class="font-semibold text-ink">Reads like a plan:</span> <span class="decision-verdict decision-verdict-good">Yes.</span><span class="text-muted"> <p>A moved section is one fact, not a deletion and an addition thirty lines apart.</p></span></li><li class="m-0 leading-relaxed"><span class="font-semibold text-ink">Reuses what exists:</span> <span class="decision-verdict decision-verdict-good">Fully.</span><span class="text-muted"> <p>Block identity already ships for commenting; comparison is its second consumer.</p></span></li><li class="m-0 leading-relaxed"><span class="font-semibold text-ink">Cost:</span> <span class="decision-verdict decision-verdict-mixed">Compile both sides.</span><span class="text-muted"> <p>A comparison compiles two snapshots rather than reading two strings.</p></span></li></ul></section><section data-decision-option="true" class="decision-option mb-4 rounded-lg border border-edge px-5 py-4 last:mb-0"><header class="mb-1 flex flex-wrap items-center gap-x-3"><h4 class="m-0 text-lg font-semibold">Textual line diff</h4></header><p class="mb-0 text-muted">Compare the raw MDX with a standard line differ.</p><ul class="mt-3 mb-0 list-none space-y-2 border-t border-edge p-0 pt-3 text-[0.9375rem]"><li class="m-0 leading-relaxed"><span class="font-semibold text-ink">Reads like a plan:</span> <span class="decision-verdict decision-verdict-bad">No.</span><span class="text-muted"> <p>Re-wrapped sentences and moved sections both read as large unrelated changes.</p></span></li><li class="m-0 leading-relaxed"><span class="font-semibold text-ink">Reuses what exists:</span> <span class="decision-verdict decision-verdict-mixed">Partly.</span><span class="text-muted"> <p><code>CodeDiff</code> could present it, but a plan reviewer is not reading code.</p></span></li><li class="m-0 leading-relaxed"><span class="font-semibold text-ink">Cost:</span> <span class="decision-verdict decision-verdict-good">Lowest.</span></li></ul></section><section data-decision-option="true" class="decision-option mb-4 rounded-lg border border-edge px-5 py-4 last:mb-0"><header class="mb-1 flex flex-wrap items-center gap-x-3"><h4 class="m-0 text-lg font-semibold">Rendered-document comparison</h4></header><p class="mb-0 text-muted">Compare the two rendered HTML documents.</p><ul class="mt-3 mb-0 list-none space-y-2 border-t border-edge p-0 pt-3 text-[0.9375rem]"><li class="m-0 leading-relaxed"><span class="font-semibold text-ink">Reads like a plan:</span> <span class="decision-verdict decision-verdict-mixed">Superficially.</span><span class="text-muted"> <p>It sees presentation, so a styling change reads as a content change.</p></span></li><li class="m-0 leading-relaxed"><span class="font-semibold text-ink">Reuses what exists:</span> <span class="decision-verdict decision-verdict-bad">No.</span><span class="text-muted"> <p>It would compare derived output, contradicting "the source is authoritative".</p></span></li><li class="m-0 leading-relaxed"><span class="font-semibold text-ink">Cost:</span> <span class="decision-verdict decision-verdict-bad">High.</span></li></ul></section></aside>

<p data-block-id="section/acceptance-criteria/paragraph-1" data-block-kind="paragraph" data-block-label="Independently checkable contract once versioning is built."><em>Independently checkable contract once versioning is built.</em></p>
<ol data-block-id="section/acceptance-criteria/list-1" data-block-kind="list" data-block-label="Applying a feedback package writes exactly one new version whose record…">
<li>Applying a feedback package writes exactly one new version whose recorded reason names that package.</li>
<li>Re-rendering a plan whose source did not change adds no new snapshot to the store.</li>
<li><code>big-plan version list</code> reports every version with its number, time, reason, and parent, in order.</li>
<li>Opening a revised plan offers a comparison against the version the reviewer last read, without the reviewer choosing anything.</li>
<li>A section that was rewritten shows as one rewritten block, with its previous text available in place.</li>
<li>A section that moved between two parts shows as one moved block naming where it came from, not as a removal plus an addition.</li>
<li>A changed block that answers a comment links to that comment's target.</li>
<li>Runs of unchanged blocks collapse to a single expandable line, and expanding one does not leave the comparison.</li>
<li>Leaving a comparison returns to the whole plan at the same section the reviewer was reading.</li>
<li>A snapshot that no longer compiles is reported as an unreadable version rather than rendered partially.</li>
<li>Version history is readable only by the reviewer's own account and is ignored by version control in a fresh repository.</li>
<li>Reading any difference issues no network request to any origin but the local review runtime's own.</li>
<li>Two plans that share a title keep entirely separate histories.</li>
<li>The same two versions always produce the same difference, on any machine.</li>
</ol>

<ul data-block-id="section/out-of-scope/list-1" data-block-kind="list" data-block-label="Branching, merging, or concurrent editing of one plan. Replacing git fo…">

<li>Replacing git for plans that are tracked in a repository.</li>
<li>Restoring a plan to an older version; reading history comes first.</li>
