<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Big Plan - Agent working indicator preview</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8f7f4;
        --surface: #fff;
        --ink: #292724;
        --muted: #6e6962;
        --edge: #d9d5cd;
        --green: #37824e;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #1f1e1b;
        --surface: #2b2925;
        --ink: #f1eee8;
        --muted: #b9b3a9;
        --edge: #49453e;
        --green: #82d59a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      main {
        width: min(100%, 920px);
        padding: 32px;
        border: 1px solid var(--edge);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: 0 12px 36px #0002;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 28px;
      }
      button {
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 8px 12px;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        border-color: var(--green);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--green) 20%, transparent);
      }
      .comparison {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
      .state-card {
        min-width: 0;
      }
      .state-caption {
        display: block;
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.1em;
      }
      .viewer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 76px;
        padding: 18px;
        border: 1px solid var(--edge);
        border-radius: 10px;
      }
      .tuning {
        display: grid;
        gap: 12px;
        margin-top: 20px;
        padding: 18px;
        border: 1px solid var(--edge);
        border-radius: 10px;
      }
      .tuning-title {
        margin: 0;
        font-size: 0.95rem;
      }
      .control {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr) 76px;
        align-items: center;
        gap: 12px;
      }
      .control label {
        font-size: 0.9rem;
        font-weight: 600;
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--green);
      }
      output {
        color: var(--muted);
        font:
          0.85rem ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        text-align: right;
      }
      .label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
      }
      .indicator {
        position: relative;
        width: 10px;
        height: 10px;
        flex: 0 0 10px;
        aspect-ratio: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: color-mix(in srgb, var(--green) 34%, transparent);
      }
      .indicator::after {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
      }
      .orbit-ring::before {
        content: "";
        position: absolute;
        inset: var(--orbit-padding);
        width: auto;
        height: auto;
        aspect-ratio: 1;
        background: conic-gradient(
          var(--green) 0deg calc(360deg - var(--orbit-opening)),
          transparent calc(360deg - var(--orbit-opening)) 360deg
        );
        border-radius: 50%;
        -webkit-mask: radial-gradient(
          circle,
          transparent calc(50% - var(--orbit-stroke)),
          #000 calc(50% - var(--orbit-stroke) + 0.5px)
        );
        mask: radial-gradient(
          circle,
          transparent calc(50% - var(--orbit-stroke)),
          #000 calc(50% - var(--orbit-stroke) + 0.5px)
        );
        animation: orbit-ring-spin var(--orbit-speed) linear infinite;
      }
      .orbit-a {
        --orbit-padding: -4px;
        --orbit-opening: 70deg;
        --orbit-stroke: 1.5px;
        --orbit-speed: 1.1s;
      }
      .orbit-b {
        --orbit-padding: -3px;
        --orbit-opening: 70deg;
        --orbit-stroke: 2px;
        --orbit-speed: 1.1s;
      }
      .orbit-c {
        --orbit-padding: -4px;
        --orbit-opening: 70deg;
        --orbit-stroke: 1.5px;
        --orbit-speed: 0.7s;
      }
      .orbit-ring::before {
        box-sizing: border-box;
      }
      .review-agent-active-indicator--working {
        aspect-ratio: 1;
      }
      .review-agent-active-indicator--working::before {
        aspect-ratio: 1;
      }
      .indicator--idle {
        animation: none;
      }
      @media (prefers-reduced-motion: no-preference) {
        @keyframes orbit-ring-spin {
          to {
            transform: rotate(360deg);
          }
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
      code {
        font-size: 0.9em;
        color: var(--muted);
      }
      @media (max-width: 720px) {
        .comparison {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Agent-active indicator</h1>
      <p>
        Live preview of PR 114. Tune the orbit ring live and compare it with the
        static idle state. These controls are demo-only.
      </p>
      <div class="toolbar" aria-label="Preview controls">
        <button id="light" aria-pressed="true">Light theme</button>
        <button id="dark" aria-pressed="false">Dark theme</button>
      </div>
      <div class="comparison">
        <div class="state-card">
          <span class="state-caption">IDLE</span>
          <div class="viewer">
            <span class="label"
              ><span class="indicator" aria-hidden="true"></span>Agent is
              idle</span
            ><code>static</code>
          </div>
        </div>
        <div class="state-card">
          <span class="state-caption">WORKING · LIVE TUNING</span>
          <div class="viewer">
            <span class="label"
              ><span
                id="working-indicator"
                class="indicator orbit-ring"
                aria-hidden="true"
              ></span
              >Agent is working</span
            ><code id="summary">4px · 70° · 1.5px · 1.1s</code>
          </div>
        </div>
      </div>
      <section class="tuning" aria-labelledby="tuning-title">
        <h2 id="tuning-title" class="tuning-title">
          Working-state tuning controls
        </h2>
        <div class="control">
          <label for="padding">Ring padding</label
          ><input
            id="padding"
            type="range"
            min="1"
            max="7"
            step="0.5"
            value="4"
          /><output id="padding-value" for="padding">4px</output>
        </div>
        <div class="control">
          <label for="opening">Ring opening</label
          ><input
            id="opening"
            type="range"
            min="20"
            max="160"
            step="5"
            value="70"
          /><output id="opening-value" for="opening">70°</output>
        </div>
        <div class="control">
          <label for="speed">Rotation speed</label
          ><input
            id="speed"
            type="range"
            min="0.4"
            max="20"
            step="0.1"
            value="1.1"
          /><output id="speed-value" for="speed">1.1s</output>
        </div>
        <div class="control">
          <label for="stroke">Stroke thickness</label
          ><input
            id="stroke"
            type="range"
            min="1"
            max="3"
            step="0.5"
            value="1.5"
          /><output id="stroke-value" for="stroke">1.5px</output>
        </div>
      </section>
    </main>
    <script>
      const root = document.documentElement;
      const indicator = document.querySelector("#working-indicator");
      const summary = document.querySelector("#summary");
      const controls = {
        padding: {
          suffix: "px",
          output: document.querySelector("#padding-value"),
        },
        opening: {
          suffix: "°",
          output: document.querySelector("#opening-value"),
        },
        speed: { suffix: "s", output: document.querySelector("#speed-value") },
        stroke: {
          suffix: "px",
          output: document.querySelector("#stroke-value"),
        },
      };
      const updateTuning = () => {
        const values = Object.fromEntries(
          Object.keys(controls).map((key) => [
            key,
            document.querySelector(`#${key}`).value,
          ]),
        );
        indicator.style.setProperty("--orbit-padding", `-${values.padding}px`);
        indicator.style.setProperty("--orbit-opening", `${values.opening}deg`);
        indicator.style.setProperty("--orbit-speed", `${values.speed}s`);
        indicator.style.setProperty("--orbit-stroke", `${values.stroke}px`);
        Object.entries(controls).forEach(([key, control]) => {
          control.output.textContent = `${values[key]}${control.suffix}`;
        });
        summary.textContent = `${values.padding}px · ${values.opening}° · ${values.stroke}px · ${values.speed}s`;
      };
      Object.keys(controls).forEach((key) =>
        document
          .querySelector(`#${key}`)
          .addEventListener("input", updateTuning),
      );
      updateTuning();
      const setPressed = (id, value) =>
        document
          .querySelector(`#${id}`)
          .setAttribute("aria-pressed", String(value));
      document.querySelector("#light").onclick = () => {
        root.dataset.theme = "light";
        setPressed("light", true);
        setPressed("dark", false);
      };
      document.querySelector("#dark").onclick = () => {
        root.dataset.theme = "dark";
        setPressed("light", false);
        setPressed("dark", true);
      };
    </script>
  </body>
</html>
